name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compilar Servidor
        run: mkdir out && javac -encoding UTF-8 -d out Servidor/*.java
      - name: Compilar Cliente
        run: mkdir out-cliente && javac -encoding UTF-8 -d out-cliente Cliente/*.java
      - name: Construir imagem Docker
        run: docker build -t backend2 .
